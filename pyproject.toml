[project]
name = "hermod"
version = "0.1.0"
description = "A Telegram companion that helps patients follow their prescription and gives doctors an adherence log."
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "litellm>=1.50",
    "apscheduler>=3.10,<4",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",  # Postgres (Supabase)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hermod*"]

[tool.ruff]
line-length = 100
extend-exclude = ["hermod-1", "frontend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
