# Optional: n8n for doctor-alert fan-out (email/Slack). The core app runs without it.
#   docker compose --profile n8n up -d   ->  http://localhost:5678
services:
  n8n:
    image: n8nio/n8n:latest
    profiles: ["n8n"]
    ports: ["5678:5678"]
    environment:
      - GENERIC_TIMEZONE=Australia/Sydney
      - N8N_SECURE_COOKIE=false
    volumes:
      - ./n8n/data:/home/node/.n8n
